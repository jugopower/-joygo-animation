<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Joy Go Animation Beta 0.3</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#eef7f0;margin:0;color:#173b2b}main{max-width:760px;margin:auto;padding:22px}.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 30px #0001}h1{font-size:25px;margin:0 0 8px}.tag{color:#567466;margin-bottom:18px}label{font-weight:700;display:block;margin:16px 0 7px}input,select{box-sizing:border-box;width:100%;font-size:17px;padding:13px;border:1px solid #bdd2c3;border-radius:12px}button{width:100%;margin-top:20px;padding:16px;border:0;border-radius:14px;background:#176b45;color:#fff;font-size:19px;font-weight:800}button:disabled{opacity:.5}.status{margin-top:16px;padding:13px;background:#f4f8f5;border-radius:12px;white-space:pre-wrap}video{width:100%;margin-top:16px;border-radius:14px;background:#111}.small{font-size:13px;color:#60756a;margin-top:10px}</style></head>
<body><main><div class="card"><h1>🎬 Joy Go Animation Beta 0.3</h1><div class="tag">完全免費測試版｜不使用 AI API｜不連接 Joy Go Platform</div>
<label>人物照片</label><input id="photo" type="file" accept="image/*">
<label>動畫效果</label><select id="effect"><option value="zoom">慢慢推近</option><option value="pan">輕微左右移動</option><option value="gentle">柔和推近</option></select>
<label>影片長度</label><select id="duration"><option value="5">5 秒</option><option value="10">10 秒</option></select>
<button id="go">🎬 一鍵生成免費 MP4</button><div id="status" class="status">等待測試。</div><video id="video" controls playsinline hidden></video><div class="small">Beta 0.3 只做照片鏡頭動畫，不會讓人物真正眨眼、說話或揮手；不需要 Replicate Token。</div></div></main>
<script>const go=document.querySelector('#go'),st=document.querySelector('#status'),vid=document.querySelector('#video');go.onclick=async()=>{const f=document.querySelector('#photo').files[0];if(!f){st.textContent='請先選擇人物照片。';return}go.disabled=true;vid.hidden=true;st.textContent='正在免費製作 MP4，請稍候…';const fd=new FormData();fd.append('photo',f);fd.append('effect',document.querySelector('#effect').value);fd.append('duration',document.querySelector('#duration').value);try{const r=await fetch('/api/generate',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw new Error(d.error||'生成失敗');st.textContent='✅ MP4 已生成，可以直接播放。';vid.src=d.video_url+'?t='+Date.now();vid.hidden=false;vid.load();vid.play().catch(()=>{})}catch(e){st.textContent='❌ '+e.message}finally{go.disabled=false}};</script></body></html>
